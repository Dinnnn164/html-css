<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Контакти | Онлайн-галерея ілюстрацій</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="/burger/burger.css">
    </head>
    
<body>
    <div class="contact-container">
        <div class="image-section">
            <img src="/assets/images/picture.6.jpg" alt="Дитячі ілюстрації">
            <div class="contact-info">
                <p>📞 <strong>Телефон:</strong> +38(068)-092-25-27</p>
                <p>💬 <strong>Telegram:</strong> <a href="https://t.me/@diannchk" target="_blank">@diannchk</a></p>
            </div>
        </div>
        <div class="form-section">
            <h2>Зв'яжіться зі мною</h2>
            <p>Маєте питання або пропозицію? Напишіть мені!</p>
            <form>
                <label for="name">Ім'я</label>
                <input type="text" id="name" name="name" placeholder="Введіть ваше ім'я" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Введіть вашу електронну адресу" required>

                <label for="message">Повідомлення</label>
                <textarea id="message" name="message" placeholder="Введіть ваше повідомлення" required></textarea>

                <div class="terms">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">Я приймаю <a href="#">умови обслуговування</a></label>
                </div>

                <button type="submit">Надіслати</button>
            </form>
        </div>
    </div>

    <nav class="burger-menu">
        <button class="burger-btn" onclick="toggleMenu()">&#9776;</button>
        <div class="burger-nav" id="burgerNav">
            <button class="close-btn" onclick="toggleMenu()">×</button>

                <li><a href="/pages/contact/contact.html">Контакти</a></li>
            </ul>
        </div>
    </nav>

    <footer>
        <nav class="bottom-nav">
            <ul>
                <li><a href="/index.html">Галерея</a></li>

                <li><a href="/pages/contact/contact.html">Контакти</a></li> 
            </ul>
        </nav>
    </footer>

    <script src="/burger/burger.js"></script>
</body>
</html>
