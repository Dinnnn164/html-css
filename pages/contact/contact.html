<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакти | Онлайн-галерея</title>
    <link rel="stylesheet" href="style.css"> <!-- Правильний шлях до CSS -->
</head>
<body>
    <header>
        <h1>Контакти</h1>
    </header>
    
    <section class="contact-form">
        <h2>Залиште своє повідомлення</h2>
        <form action="#" method="post">
            <label for="name">Ваше ім'я:</label>
            <input type="text" id="name" name="name" required>
            
            <label for="email">Електронна пошта:</label>
            <input type="email" id="email" name="email" required>
            
            <label for="message">Повідомлення:</label>
            <textarea id="message" name="message" rows="4" required></textarea>
            
            <label for="subject">Тема:</label>
            <select id="subject" name="subject" required>
                <option value="">Оберіть тему</option>
                <option value="Запит">Запит</option>
                <option value="Відгук">Відгук</option>
                <option value="Інше">Інше</option>
            </select>
            
            <button type="submit">Відправити</button>
        </form>
    </section>

    <footer>
        <nav class="bottom-nav">
            <ul>
                <li><a href="../../index.html">Домашня</a></li>
                <li><a href="../about.html">Про нас</a></li> <!-- Правильний шлях до about.html -->
                <li><a href="../services.html">Послуги</a></li> <!-- Правильний шлях до services.html -->
                <li><a href="../portfolio.html">Портфоліо</a></li> <!-- Правильний шлях до portfolio.html -->
                <li><a href="contact.html">Контакти</a></li> <!-- Це вже правильно -->
            </ul>
        </nav>
    </footer>
</body>
</html>
